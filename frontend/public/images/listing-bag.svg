<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-label="Product photo of a brown leather handbag on a neutral background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6efe5"/>
      <stop offset="100%" stop-color="#e8ddcb"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="50%" stop-color="#6b4423"/>
      <stop offset="100%" stop-color="#4a2f17"/>
    </linearGradient>
    <linearGradient id="bagShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.22)"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="320" height="280" fill="url(#bg)"/>
  <ellipse cx="160" cy="230" rx="95" ry="10" fill="rgba(0,0,0,0.15)"/>

  <g filter="url(#softShadow)">
    <path d="M 90 100 Q 90 80 110 80 L 210 80 Q 230 80 230 100 L 230 220 Q 230 230 220 230 L 100 230 Q 90 230 90 220 Z" fill="url(#bagBody)"/>
    <path d="M 90 100 Q 90 80 110 80 L 210 80 Q 230 80 230 100 L 230 220 Q 230 230 220 230 L 100 230 Q 90 230 90 220 Z" fill="url(#bagShade)"/>
    <path d="M 90 100 Q 90 80 110 80 L 210 80 Q 230 80 230 100 L 230 220 Q 230 230 220 230 L 100 230 Q 90 230 90 220 Z" fill="url(#spot)"/>

    <path d="M 110 80 Q 110 40 140 40 L 180 40 Q 210 40 210 80" stroke="#3a2410" stroke-width="6" fill="none" stroke-linecap="round"/>

    <circle cx="160" cy="155" r="16" fill="#2b1a0b" opacity="0.55"/>
    <circle cx="160" cy="155" r="6" fill="#d4a770"/>

    <line x1="110" y1="95" x2="210" y2="95" stroke="#3a2410" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="215" x2="210" y2="215" stroke="#3a2410" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
